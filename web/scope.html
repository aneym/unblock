<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scoping</title>
<link rel="icon" href="./favicon.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">

</head>
<body class="scope-page">
<header class="bar"><div class="bar-inner">
  <div class="bar-name" id="barName">Scoping</div>
  <div class="live" id="live" title="Live updates"><span class="dot"></span><span class="label">Connecting</span></div>
</div></header>
<main id="main"><p class="empty">Loading…</p></main>
<div class="dock" id="dock" hidden><div class="dock-inner">
  <div class="reply">
    <textarea id="thought" rows="1" placeholder="Drop a thought for the lane"></textarea>
    <button class="btn" id="thoughtMic" type="button" aria-label="Talk about this doc"><svg aria-hidden="true" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="2" width="6" height="13" rx="3"/><path d="M5 10v2a7 7 0 0 0 14 0v-2m-7 9v3m-4 0h8"/></svg></button>
    <button class="btn primary" id="thoughtSend" type="button">Send</button>
  </div>
</div></div>
<div id="voiceRoot" data-cm-skip></div>
<script type="module" src="/src/scope/page.ts"></script>
</body>
</html>
