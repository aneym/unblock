<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!--
    The gating dot: the same mark the queue uses for an agent that is stopped.
    Drawn on a transparent ground so it reads on a light or dark tab strip, and
    kept to one accent so a browser tab says the same thing the page does.
  -->
  <rect x="1.5" y="1.5" width="29" height="29" rx="2"
        fill="none" stroke="#96968f" stroke-width="2"/>
  <circle cx="16" cy="16" r="6.5" fill="#ff4d00"/>
</svg>
